trigger: none

pr:
  autoCancel: true
  branches:
    include:
      - main
  paths:
    include:
      - azure-iac/2026-08-31-custom-rbac-roles/modules/*.bicep
      - azure-iac/2026-08-31-custom-rbac-roles/parameters/*.bicepparam
    exclude:
      - azure-iac/2026-08-31-custom-rbac-roles/docs/**

parameters:
  - name: azureServiceConnection
    displayName: 'ARM service connection name (workload identity federation, no stored secrets)'
    type: string
  - name: subscriptionId
    displayName: 'Target subscription ID'
    type: string
  - name: location
    displayName: 'Deployment location'
    type: string
    default: 'westeurope'

variables:
  - name: templateFile
    value: 'azure-iac/2026-08-31-custom-rbac-roles/modules/customRoles.bicep'
  - name: parameterFile
    value: 'azure-iac/2026-08-31-custom-rbac-roles/parameters/customRoles.bicepparam'
  - name: deploymentStackName
    value: 'DeployCustomRbacRoles'
  - name: poolName
    value: 'ubuntu-latest'

pool:
  vmImage: $(poolName)

stages:
- stage: BicepLintChecks
  displayName: Run bicep lint checks
  jobs:
    - job: BicepLintCheckJob
      displayName: Bicep lint check job
      steps:
        - checkout: self
        - task: AzureCLI@2
          displayName: Build template file for lint check
          inputs:
            azureSubscription: ${{ parameters.azureServiceConnection }}
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: |
              az bicep build --file $(templateFile)

- stage: ValidateDeployment
  displayName: Validate Bicep Deployment
  dependsOn: BicepLintChecks
  jobs:
    - job: ValidateDeploymentJob
      displayName: Run Deployment Validation
      steps:
        - checkout: self
        - task: AzureCLI@2
          displayName: Validate deployment (RBAC/preflight)
          inputs:
            azureSubscription: ${{ parameters.azureServiceConnection }}
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: |
              #Update to latest az cli version to support stack commands
              az upgrade --yes

              $azArgs = @(
                'stack', 'sub', 'validate',
                '--name', '$(deploymentStackName)',
                '--subscription', '${{ parameters.subscriptionId }}',
                '--location', '${{ parameters.location }}',
                '--template-file', '$(templateFile)',
                '--parameters', '$(parameterFile)',
                '--deny-settings-mode', 'DenyDelete',
                '--action-on-unmanage', 'DeleteAll',
                '--validation-level', 'Provider'
              )
              az @azArgs

              # Check if the last command was successful - pscore does not throw an error on failure, so we need to check the exit code
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Validation failed"
                  exit 1
              }

- stage: WhatIfDeployment
  displayName: What-If Bicep Deployment
  dependsOn: ValidateDeployment
  jobs:
    - job: WhatIfDeploymentJob
      displayName: Run What-If deployment
      steps:
        - checkout: self
        - task: AzureCLI@2
          displayName: What-if deployment
          inputs:
            azureSubscription: ${{ parameters.azureServiceConnection }}
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: |
              #Update to latest az cli version to support stack commands
              az upgrade --yes

              # Print az version to verify the upgrade
              az version

              $azArgs = @(
                'stack-whatif', 'sub', 'create',
                '--location', '${{ parameters.location }}',
                '--subscription', '${{ parameters.subscriptionId }}',
                '--template-file', '$(templateFile)',
                '--parameters', '$(parameterFile)',
                '--validation-level', 'ProviderNoRbac'
              )
              az @azArgs

              # Check if the last command was successful - pscore does not throw an error on failure, so we need to check the exit code
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "What-if failed"
                  exit 1
              }
        - task: AzureCLI@2
          displayName: Delete what-if stack (custom role definitions are low-volume/high-impact, avoid lingering stacks)
          inputs:
            azureSubscription: ${{ parameters.azureServiceConnection }}
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: |
              $azArgs = @(
                'stack', 'sub', 'delete',
                '--name', '$(deploymentStackName)',
                '--subscription', '${{ parameters.subscriptionId }}',
                '--yes',
                '--action-on-unmanage', 'deleteAll'
              )
              az @azArgs

              # Check if the last command was successful - pscore does not throw an error on failure, so we need to check the exit code
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Deletion of what-if stack failed"
                  exit 1
              }

- stage: DeployBicep
  displayName: Deploy Bicep
  dependsOn: WhatIfDeployment
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - deployment: DeployBicepJob
      displayName: Run Bicep Deployment
      environment: prd
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
              - task: AzureCLI@2
                displayName: Deploy Bicep
                inputs:
                  azureSubscription: ${{ parameters.azureServiceConnection }}
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: |
                    #Update to latest az cli version to support stack commands
                    az upgrade --yes

                    # Print az version to verify the upgrade
                    az version

                    $azArgs = @(
                      'stack', 'sub', 'create',
                      '--name', '$(deploymentStackName)',
                      '--subscription', '${{ parameters.subscriptionId }}',
                      '--location', '${{ parameters.location }}',
                      '--template-file', '$(templateFile)',
                      '--parameters', '$(parameterFile)',
                      '--deny-settings-mode', 'DenyDelete',
                      '--action-on-unmanage', 'DeleteAll',
                      '--validation-level', 'Provider'
                    )
                    az @azArgs
                    # Check if the last command was successful - pscore does not throw an error on failure, so we need to check the exit code
                    if ($LASTEXITCODE -ne 0) {
                        Write-Error "Deployment failed"
                        exit 1
                    }
